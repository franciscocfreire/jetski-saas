# =============================================================================
# Override do ESPELHO de testes de carga — terceira camada sobre base + prod:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.espelho.yml
#
# O deploy.sh aplica esta camada sozinho quando o .env tem MEUJET_AMBIENTE=espelho
# (e só depois de o infra/espelho/preflight.sh aprovar o .env). Ver
# infra/espelho/README.md.
#
# Princípio: o espelho roda a MESMA stack de produção (perfil prod, mesmos
# limites de memória, mesmo JVM, mesmo nginx) — só muda o que encosta no mundo
# real. Qualquer diferença além disso invalida a comparação de capacidade.
# =============================================================================
services:
  # O compose base publica o Mailpit em 0.0.0.0 (é serviço de dev). No espelho
  # ele passa a receber TODO e-mail da plataforma — inclusive links de ativação
  # de conta —, então fica só em loopback. Para ver a caixa:
  #   ssh -L 8025:127.0.0.1:8025 ubuntu@<ip-do-espelho>  →  http://localhost:8025
  mailpit:
    ports: !override
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      # Aceita qualquer usuário/senha SMTP, sem exigir TLS: o SMTP por empresa
      # (SmtpSenderFactory) tem AUTH fixo, e assim as empresas-persona enviam para cá
      # sem nenhuma adaptação no código — basta starttls=false na config da empresa.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      # O padrão guarda só 500 mensagens e descarta as mais antigas: com personas e
      # carga, um convite podia sumir antes de ser lido.
      MP_MAX_MESSAGES: "20000"

  backend:
    environment:
      # O application-prod.yml exige AUTH + STARTTLS (correto para o Gmail). O
      # Mailpit não tem nenhum dos dois, então o espelho desliga ambos.
      #
      # SPRING_APPLICATION_JSON em vez de SPRING_MAIL_PROPERTIES_...: as chaves
      # do mapa `spring.mail.properties` têm pontos (`mail.smtp.auth`), que não
      # sobrevivem à conversão de nome de variável de ambiente. Em JSON a chave
      # vai literal — e esta fonte tem precedência sobre o application-prod.yml.
      #
      # As bases da GRU apontam para o serviço de fakes (ECOSSISTEMA_SINTETICO_SPEC.md,
      # fase E2). Enquanto ele não existir, o nome não resolve e a emissão cai no
      # fallback manual (MARINHA_INDISPONIVEL) — falha fechada, nunca o site real.
      SPRING_APPLICATION_JSON: >-
        {"spring.mail.properties.mail.smtp.auth":"false",
         "spring.mail.properties.mail.smtp.starttls.enable":"false",
         "spring.mail.properties.mail.smtp.starttls.required":"false",
         "jetski.gru.marinha-base":"http://fakes-externos:8080/marinha",
         "jetski.gru.pagtesouro-base":"http://fakes-externos:8080/pagtesouro"}
    # Sumidouro de DNS — segunda camada. Se a configuração acima se perder e o código
    # usar o endereço padrão, os domínios REAIS resolvem para o loopback do próprio
    # container, onde nada escuta: conexão recusada na hora. Um CPF sintético de DV
    # válido pode ser de uma pessoa real; ele não pode chegar à Marinha nem ao Tesouro.
    extra_hosts:
      - "dpc1.marinha.mil.br:127.0.0.1"
      - "pagtesouro.tesouro.gov.br:127.0.0.1"
      - "freetsa.org:127.0.0.1"
