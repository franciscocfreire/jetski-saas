# =============================================================================
# pg_hba.conf de PRODUÇÃO — montado pelo docker-compose.prod.yml
# (postgres -c hba_file=/etc/postgresql/pg_hba.conf)
# =============================================================================
# P0 da revisão técnica (revisao-2026-08-21, cap. 7, achado 7.1): o volume de
# prod nasceu com "host all all all trust" (herdado do compose base) — qualquer
# container da jetski-network (nginx, cloudflared, observabilidade) ou processo
# da VM logava como superuser SEM senha, contornando toda a RLS.
#
# Regras:
# - TCP (rede Docker e 127.0.0.1 publicado na VM): SEMPRE com senha SCRAM.
#   Clients: backend (jetski_app / JETSKI_APP_DB_PASSWORD), Keycloak e Flyway
#   (jetski / POSTGRES_PASSWORD). As senhas são gravadas nos roles pelo
#   entrypoint (jetski) e pelo infra/prod/01-init-roles.sql a cada deploy
#   (jetski_app); password_encryption = scram-sha-256.
# - Socket unix DENTRO do container: trust. Só é alcançável via
#   `docker compose exec postgres ...` (deploy.sh, backup.sh), o que já exige
#   acesso ao daemon Docker (= root na VM).
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    all             all             all                     scram-sha-256
