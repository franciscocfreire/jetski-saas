# Alertas da Praia Sintética — SÓ NO ESPELHO (montado por docker-compose.observability.espelho.yml).
# Em produção este arquivo não existe: lá não há praia e as regras ficariam em "sem dados".
# Notificação: contact point "email-ops"; no espelho o SMTP é o Mailpit, então o aviso fica
# visível no Grafana (Alerting) e na caixa do Mailpit — não sai e-mail para fora.

apiVersion: 1

groups:
  - orgId: 1
    name: praia-espelho
    folder: Praia Sintética
    interval: 1m
    rules:
      # ------------------------------------------------------------------
      - uid: praia-fora
        title: Praia Sintética fora do ar
        condition: C
        for: 3m
        labels:
          severity: critical
          ambiente: espelho
        annotations:
          summary: >-
            O Prometheus do espelho não consegue raspar a praia (up == 0) há 3 minutos.
            Na VM: `sudo docker ps | grep praia` e `sudo docker logs praia-sintetica-praia-1`.
        isPaused: false
        noDataState: Alerting
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: Prometheus
            model:
              expr: up{job="praia"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: lt, params: [1] }

      # ------------------------------------------------------------------
      - uid: praia-fonte-desligada
        title: Fonte da Praia Sintética desligada
        condition: C
        for: 15m
        labels:
          severity: warning
          ambiente: espelho
        annotations:
          summary: >-
            Uma fonte da praia (auditoria, fakes ou mailpit) está desligada ou com erro há 15 minutos.
            Ver o painel "Praia Sintética" e os logs do container.
        isPaused: false
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: Prometheus
            model:
              expr: min by (fonte) (praia_fonte_ligada{fonte!="ingest"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: lt, params: [1] }

      # ------------------------------------------------------------------
      - uid: praia-tokens-vencendo
        title: Tokens da auditoria da praia vencendo
        condition: C
        for: 10m
        labels:
          severity: warning
          ambiente: espelho
        annotations:
          summary: >-
            O tokens.json da auditoria tem mais de 11 h (é renovado a cada 10 h e vale ~12 h) ou sumiu.
            Na VM: `systemctl list-timers | grep praia` e `sudo journalctl -u praia-tokens.service`.
        isPaused: false
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: Prometheus
            model:
              # -1 = arquivo ausente; a faixa [0, 11 h] do limiar abaixo trata ausente e vencido igual
              expr: max(praia_tokens_auditoria_idade_segundos)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator: { type: outside_range, params: [0, 39600] }
