# Telegraf — métricas por container via API do Docker (substitui o cAdvisor,
# que não suporta o containerd image store do Docker moderno: google/cadvisor#3643).
# Lê o docker.sock, então funciona independente do storage driver.

[agent]
  interval = "30s"
  flush_interval = "30s"
  omit_hostname = true

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  timeout = "10s"
  # só o total de CPU (sem per-core) e sem per-device de disco
  perdevice = false
  total = true
  # labels do container virariam tags/labels no Prometheus (com.docker.compose.*
  # em todo container do compose) — cardinalidade inútil, o container_name basta
  docker_label_exclude = ["*"]
  # tags voláteis: container_id/versão mudam a cada recreate (todo deploy!) e
  # criariam uma série nova por deploy — com elas fora, o container recriado
  # continua a MESMA série e não aparece duplicado nos painéis
  tagexclude = ["container_id", "container_image", "container_version",
                "container_status", "engine_host", "server_version"]
  # container_id também existe como FIELD string (vira label no Prometheus)
  fieldexclude = ["container_id"]

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  # sem métricas internas do processo Go do próprio Telegraf
  collectors_exclude = ["gocollector", "process"]
  expiration_interval = "3m"

# ------------------------------------------------------------------
# Saúde das dependências internas (P1 do lançamento): TCP check nos
# serviços de estado — o Prometheus só raspava o backend; postgres/
# keycloak/redis/opa caídos só apareciam indiretamente.
# result_code: 0 = ok; >0 = falha (alerta "Dependência interna fora do ar").
[[inputs.net_response]]
  protocol = "tcp"
  address = "postgres:5432"
  timeout = "5s"

[[inputs.net_response]]
  protocol = "tcp"
  address = "redis:6379"
  timeout = "5s"

[[inputs.net_response]]
  protocol = "tcp"
  address = "keycloak:8080"
  timeout = "5s"

[[inputs.net_response]]
  protocol = "tcp"
  address = "opa:8181"
  timeout = "5s"

# ------------------------------------------------------------------
# SSO (Keycloak) por HTTP — alerta "SSO indisponível" (PLANO_SSO_DEPLOY.md, ajuste B).
# O TCP acima só diz "porta aberta": a porta abre antes do realm estar pronto, e a
# regra de 3 min não viu a queda de ~3 min do deploy de 13/set. Duas sondas:
#  - interna: health/ready do Keycloak (pronto E com banco), direto na rede do app;
#  - pública: o caminho do usuário (Cloudflare → túnel → nginx → Keycloak).
# result_code: 0 = ok; >0 = falha (3 conexão, 4 timeout, 5 DNS, 6 código HTTP != 200).
#
# tagexclude result/status_code + fieldexclude result_type: tudo isso muda quando a
# sonda falha. Tag vira label, e o campo TEXTO result_type também vira label no
# prometheus_client (metric_version 2). Cada mudança criaria uma série nova; a antiga
# (valor 0 ou de falha) seguiria exposta por 3 min (expiration_interval) e seguraria
# o alerta aceso depois da volta. Sem elas, cada sonda é UMA série, atualizada no
# lugar. O motivo da falha fica no valor de result_code.
[[inputs.http_response]]
  interval = "15s"
  urls = ["http://keycloak:9000/health/ready"]
  response_timeout = "5s"
  method = "GET"
  response_status_code = 200
  tagexclude = ["result", "status_code"]
  fieldexclude = ["result_type"]
  [inputs.http_response.tags]
    sonda = "sso-interno"

[[inputs.http_response]]
  interval = "15s"
  # SSO_PUBLIC_URL vem do .env (prod: https://sso.meujet.com.br) pelo compose.
  urls = ["${SSO_PUBLIC_URL}/realms/jetski-saas/.well-known/openid-configuration"]
  response_timeout = "10s"
  method = "GET"
  response_status_code = 200
  tagexclude = ["result", "status_code"]
  fieldexclude = ["result_type"]
  # Sem User-Agent de navegador o Cloudflare devolve 403 "error code: 1010".
  [inputs.http_response.headers]
    User-Agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36 MeuJet-Sonda-SSO"
  [inputs.http_response.tags]
    sonda = "sso-publico"

# Backup diário: idade do marcador last-success (montado pelo compose;
# em dev o arquivo não existe → alerta configurado com noDataState: OK).
[[inputs.filestat]]
  files = ["/host/backups/last-success"]
