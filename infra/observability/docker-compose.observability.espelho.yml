# Camada do ESPELHO sobre a observabilidade de produção:
#   docker compose --env-file .env -f infra/observability/docker-compose.observability.yml \
#                  -f infra/observability/docker-compose.observability.espelho.yml up -d
# Só acrescenta alvos ao job 'extras' do Prometheus, via file_sd (glob
# /etc/prometheus/alvos-extras-*.json) — o prometheus-prod.yml não muda:
# - os fakes (fakes-externos:8080/metrics);
# - a Praia Sintética (praia:7331/api/metricas — a rota só responde na rede interna; pela
#   Cloudflare é 404). O painel e os alertas dela entram no Grafana do espelho pela API
#   (scripts/espelho/grafana-praia.sh do projeto da praia): as pastas de provisionamento do
#   Grafana são as da produção, montadas somente-leitura, e não recebem arquivo por cima.
# O provisionamento do espelho usa esta camada.
services:
  prometheus:
    volumes:
      - ./prometheus/alvos-extras.espelho/fakes.json:/etc/prometheus/alvos-extras-fakes.json:ro
      - ./prometheus/alvos-extras.espelho/praia.json:/etc/prometheus/alvos-extras-praia.json:ro
