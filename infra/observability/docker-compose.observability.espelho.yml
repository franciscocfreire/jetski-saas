# Camada do ESPELHO sobre a observabilidade de produção:
#   docker compose --env-file .env -f infra/observability/docker-compose.observability.yml \
#                  -f infra/observability/docker-compose.observability.espelho.yml up -d
# Só acrescenta o alvo dos fakes (fakes-externos:8080/metrics) ao job 'extras' do Prometheus,
# via file_sd (glob /etc/prometheus/alvos-extras-*.json) — o prometheus-prod.yml não muda. O provisionamento do espelho usa esta camada.
services:
  prometheus:
    volumes:
      - ./prometheus/alvos-extras.espelho/fakes.json:/etc/prometheus/alvos-extras-fakes.json:ro
